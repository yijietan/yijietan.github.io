<!-- Email signup via Buttondown (newsletter: buttondown.com/yijietan). -->
<section class="subscribe" id="subscribe" aria-labelledby="subscribe-title">
  <p class="subscribe-title" id="subscribe-title">Get the next deep dive by email</p>
  <p class="subscribe-blurb">New analyses of Singapore's buses and trains, a few times a year. No spam, unsubscribe anytime.</p>
  <form class="subscribe-form"
        action="https://buttondown.com/api/emails/embed-subscribe/yijietan"
        method="post" target="popupwindow"
        onsubmit="window.open('https://buttondown.com/yijietan', 'popupwindow')">
    <label class="visually-hidden" for="bd-email">Email address</label>
    <input type="email" name="email" id="bd-email" placeholder="you@example.com" autocomplete="email" required>
    <button type="submit">Subscribe</button>
  </form>
  <p class="subscribe-alt">Or follow via <a href="/index.xml">RSS</a>.</p>
</section>
